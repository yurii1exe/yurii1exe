<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="232" viewBox="0 0 1000 232" fill="#e6edf3" role="img" aria-label="01 edi-x12-toolkit. Problem: Trading partners reject files, and the rejection rarely says why. Support time goes into guessing. Decision: Read the format the way the standard defines it, and explain every error in plain words. Outcome: Problems surface before a partner sees them. Anyone can try it in a browser, nothing to install.">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.muted{fill:#8b949e}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e6edf3" fill-opacity=".06"/></pattern><radialGradient id="glow" cx="12%" cy="0%" r="75%"><stop offset="0" stop-color="#58a6ff" stop-opacity=".15"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient><radialGradient id="glow2" cx="92%" cy="100%" r="60%"><stop offset="0" stop-color="#3fb950" stop-opacity=".12"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></radialGradient><linearGradient id="flow" x1="0" x2="1000" y1="0" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#58a6ff"/><stop offset=".55" stop-color="#bc8cff"/><stop offset="1" stop-color="#3fb950"/></linearGradient></defs>
<rect width="1000" height="232" rx="16" fill="#0d1117"/>
<rect width="1000" height="232" rx="16" fill="url(#dots)"/>
<rect width="1000" height="232" rx="16" fill="url(#glow)"/>
<rect width="1000" height="232" rx="16" fill="url(#glow2)"/>
<rect x=".5" y=".5" width="999" height="231" rx="16" fill="none" stroke="#30363d"/>
<rect x="16" y="28" width="3" height="176" rx="1.5" fill="url(#flow)"/>
<text x="36" y="74" font-size="42" font-weight="800" fill="none" stroke="url(#flow)" stroke-width="1.3">01</text>
<text x="106" y="44" font-size="12.5" class="mono muted">github.com/yurii1exe/<tspan fill="#58a6ff">edi-x12-toolkit</tspan></text>
<text x="105" y="76" font-size="26" font-weight="750" class="mono">edi-x12-toolkit</text>
<text x="960" y="44" text-anchor="end" font-size="13" font-weight="600" fill="#3fb950"><tspan class="pulse">●</tspan> try it in your browser</text>
<line x1="106" y1="104" x2="364" y2="104" stroke="#58a6ff" stroke-opacity=".55" stroke-width="2"/>
<text x="106" y="128" font-size="11.5" letter-spacing="1.8" class="mono" fill="#58a6ff" font-weight="700">PROBLEM</text>
<text x="106" y="154" font-size="15">Trading partners reject files, and</text>
<text x="106" y="175" font-size="15">the rejection rarely says why.</text>
<text x="106" y="196" font-size="15">Support time goes into guessing.</text>
<line x1="398" y1="104" x2="656" y2="104" stroke="#bc8cff" stroke-opacity=".55" stroke-width="2"/>
<text x="398" y="128" font-size="11.5" letter-spacing="1.8" class="mono" fill="#bc8cff" font-weight="700">DECISION</text>
<text x="398" y="154" font-size="15">Read the format the way the</text>
<text x="398" y="175" font-size="15">standard defines it, and explain</text>
<text x="398" y="196" font-size="15">every error in plain words.</text>
<line x1="690" y1="104" x2="948" y2="104" stroke="#3fb950" stroke-opacity=".55" stroke-width="2"/>
<text x="690" y="128" font-size="11.5" letter-spacing="1.8" class="mono" fill="#3fb950" font-weight="700">OUTCOME</text>
<text x="690" y="154" font-size="15">Problems surface before a partner</text>
<text x="690" y="175" font-size="15">sees them. Anyone can try it in a</text>
<text x="690" y="196" font-size="15">browser, nothing to install.</text>
</svg>