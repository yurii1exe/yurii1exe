<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="01 edi-x12-toolkit: Reads the delimiters instead of guessing them.">
<style>
text{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#1f2328}
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.seg{fill:#9a6700;font-weight:700} .el{fill:#0969da} .term{fill:#cf222e} .comp{fill:#8250df}
.muted{fill:#656d76} .ok{fill:#1a7f37}
.key{font-weight:700;animation:glow 2.4s ease-in-out infinite}
.dot{animation:glow 2.4s ease-in-out infinite}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes glow{50%{opacity:.3}}
@keyframes blink{50%{opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1f2328" fill-opacity=".07"/></pattern><radialGradient id="glow" cx="18%" cy="0%" r="70%"><stop offset="0" stop-color="#0969da" stop-opacity=".16"/><stop offset="1" stop-color="#0969da" stop-opacity="0"/></radialGradient></defs>
<rect width="1000" height="150" rx="14" fill="#ffffff"/>
<rect width="1000" height="150" rx="14" fill="url(#dots)"/>
<rect width="1000" height="150" rx="14" fill="url(#glow)"/>
<rect x=".5" y=".5" width="999" height="149" rx="14" fill="none" stroke="#d0d7de"/>
<rect x="16" y="28" width="3" height="94" rx="1.5" fill="#9a6700"/>
<text x="34" y="74" font-size="40" font-weight="800" fill="none" stroke="#9a6700" stroke-width="1.2">01</text>
<text x="104" y="50" font-size="12.5" class="muted">github.com/yurii1exe/<tspan class="el">edi-x12-toolkit</tspan></text>
<text x="104" y="82" font-size="27" font-weight="700">edi-x12-toolkit</text>
<text x="105" y="108" class="sans muted" font-size="16">Reads the delimiters instead of guessing them.</text>
<rect x="104" y="120" width="31.2" height="20" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="119.6" y="134" text-anchor="middle" font-size="11" class="muted" textLength="13.2" lengthAdjust="spacingAndGlyphs">C#</text>
<rect x="143.2" y="120" width="110.4" height="20" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="198.4" y="134" text-anchor="middle" font-size="11" class="muted" textLength="92.4" lengthAdjust="spacingAndGlyphs">netstandard2.0</text>
<rect x="261.59999999999997" y="120" width="57.6" height="20" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="290.4" y="134" text-anchor="middle" font-size="11" class="muted" textLength="39.6" lengthAdjust="spacingAndGlyphs">net8.0</text>
<rect x="327.19999999999993" y="120" width="90.6" height="20" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="372.5" y="134" text-anchor="middle" font-size="11" class="muted" textLength="72.6" lengthAdjust="spacingAndGlyphs">WebAssembly</text>
<rect x="425.79999999999995" y="120" width="110.4" height="20" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="481.0" y="134" text-anchor="middle" font-size="11" class="muted" textLength="92.4" lengthAdjust="spacingAndGlyphs">0 dependencies</text>
<rect x="544.1999999999999" y="120" width="37.8" height="20" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="563.1" y="134" text-anchor="middle" font-size="11" class="muted" textLength="19.8" lengthAdjust="spacingAndGlyphs">MIT</text>
<text x="960" y="50" text-anchor="end" font-size="12.5" class="ok" font-weight="600"><tspan class="dot">●</tspan> runs in your browser</text>
<text x="960" y="84" text-anchor="end" font-size="14"><tspan class="seg">ISA</tspan><tspan class="term"> → </tspan><tspan class="el">delimiters</tspan><tspan class="term"> → </tspan><tspan class="el">typed tree</tspan><tspan class="term"> → </tspan><tspan class="seg">diagnostics</tspan></text>
</svg>