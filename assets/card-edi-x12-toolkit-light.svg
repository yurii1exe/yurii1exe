<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" fill="#1f2328" role="img" aria-label="01 edi-x12-toolkit: A parser that reads the format instead of guessing it.">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.muted{fill:#656d76}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1f2328" fill-opacity=".07"/></pattern><radialGradient id="glow" cx="15%" cy="0%" r="75%"><stop offset="0" stop-color="#0969da" stop-opacity=".16"/><stop offset="1" stop-color="#0969da" stop-opacity="0"/></radialGradient><radialGradient id="glow2" cx="95%" cy="100%" r="60%"><stop offset="0" stop-color="#8250df" stop-opacity=".12"/><stop offset="1" stop-color="#8250df" stop-opacity="0"/></radialGradient><linearGradient id="flow" x1="0" x2="1000" y1="0" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0969da"/><stop offset=".5" stop-color="#8250df"/><stop offset="1" stop-color="#1a7f37"/></linearGradient></defs>
<rect width="1000" height="150" rx="16" fill="#ffffff"/>
<rect width="1000" height="150" rx="16" fill="url(#dots)"/>
<rect width="1000" height="150" rx="16" fill="url(#glow)"/>
<rect width="1000" height="150" rx="16" fill="url(#glow2)"/>
<rect x=".5" y=".5" width="999" height="149" rx="16" fill="none" stroke="#d0d7de"/>
<rect x="16" y="28" width="3" height="94" rx="1.5" fill="url(#flow)"/>
<text x="36" y="76" font-size="42" font-weight="800" fill="none" stroke="url(#flow)" stroke-width="1.3">01</text>
<text x="106" y="50" font-size="12.5" class="mono muted">github.com/yurii1exe/<tspan fill="#0969da">edi-x12-toolkit</tspan></text>
<text x="105" y="83" font-size="27" font-weight="750" class="mono">edi-x12-toolkit</text>
<text x="106" y="108" font-size="16" class="muted">A parser that reads the format instead of guessing it.</text>
<rect x="106" y="120" width="31.2" height="20" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="121.6" y="134" text-anchor="middle" font-size="11" class="mono muted" textLength="13.2" lengthAdjust="spacingAndGlyphs">C#</text>
<rect x="145.2" y="120" width="110.4" height="20" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="200.4" y="134" text-anchor="middle" font-size="11" class="mono muted" textLength="92.4" lengthAdjust="spacingAndGlyphs">netstandard2.0</text>
<rect x="263.59999999999997" y="120" width="57.6" height="20" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="292.4" y="134" text-anchor="middle" font-size="11" class="mono muted" textLength="39.6" lengthAdjust="spacingAndGlyphs">net8.0</text>
<rect x="329.19999999999993" y="120" width="90.6" height="20" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="374.5" y="134" text-anchor="middle" font-size="11" class="mono muted" textLength="72.6" lengthAdjust="spacingAndGlyphs">WebAssembly</text>
<rect x="427.79999999999995" y="120" width="110.4" height="20" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="483.0" y="134" text-anchor="middle" font-size="11" class="mono muted" textLength="92.4" lengthAdjust="spacingAndGlyphs">0 dependencies</text>
<rect x="546.1999999999999" y="120" width="37.8" height="20" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="565.1" y="134" text-anchor="middle" font-size="11" class="mono muted" textLength="19.8" lengthAdjust="spacingAndGlyphs">MIT</text>
<text x="960" y="50" text-anchor="end" font-size="13" font-weight="600" fill="#1a7f37"><tspan class="pulse">●</tspan> runs in your browser</text>
<text x="960" y="84" text-anchor="end" font-size="14" class="mono"><tspan fill="#0969da">raw file</tspan><tspan class="muted"> → </tspan><tspan fill="#8250df">delimiters</tspan><tspan class="muted"> → </tspan><tspan fill="#8250df">typed tree</tspan><tspan class="muted"> → </tspan><tspan fill="#1a7f37">diagnostics</tspan></text>
</svg>