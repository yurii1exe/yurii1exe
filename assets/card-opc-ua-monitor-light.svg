<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="232" viewBox="0 0 1000 232" fill="#1f2328" role="img" aria-label="03 opc-ua-monitor. Problem: On a plant floor, an old number that looks live is worse than no number at all. Decision: Stream live values, and say plainly when a connection drops and the data goes stale. Outcome: Operators can trust what the screen tells them. On a dashboard, trust is the product.">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.muted{fill:#656d76}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1f2328" fill-opacity=".06"/></pattern><radialGradient id="glow" cx="12%" cy="0%" r="75%"><stop offset="0" stop-color="#0969da" stop-opacity=".15"/><stop offset="1" stop-color="#0969da" stop-opacity="0"/></radialGradient><radialGradient id="glow2" cx="92%" cy="100%" r="60%"><stop offset="0" stop-color="#1a7f37" stop-opacity=".12"/><stop offset="1" stop-color="#1a7f37" stop-opacity="0"/></radialGradient><linearGradient id="flow" x1="0" x2="1000" y1="0" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0969da"/><stop offset=".55" stop-color="#8250df"/><stop offset="1" stop-color="#1a7f37"/></linearGradient></defs>
<rect width="1000" height="232" rx="16" fill="#ffffff"/>
<rect width="1000" height="232" rx="16" fill="url(#dots)"/>
<rect width="1000" height="232" rx="16" fill="url(#glow)"/>
<rect width="1000" height="232" rx="16" fill="url(#glow2)"/>
<rect x=".5" y=".5" width="999" height="231" rx="16" fill="none" stroke="#d0d7de"/>
<rect x="16" y="28" width="3" height="176" rx="1.5" fill="url(#flow)"/>
<text x="36" y="74" font-size="42" font-weight="800" fill="none" stroke="url(#flow)" stroke-width="1.3">03</text>
<text x="106" y="44" font-size="12.5" class="mono muted">github.com/yurii1exe/<tspan fill="#0969da">opc-ua-monitor</tspan></text>
<text x="105" y="76" font-size="26" font-weight="750" class="mono">opc-ua-monitor</text>
<text x="960" y="44" text-anchor="end" font-size="13" font-weight="600" fill="#8250df">real-time</text>
<line x1="106" y1="104" x2="364" y2="104" stroke="#0969da" stroke-opacity=".55" stroke-width="2"/>
<text x="106" y="128" font-size="11.5" letter-spacing="1.8" class="mono" fill="#0969da" font-weight="700">PROBLEM</text>
<text x="106" y="154" font-size="15">On a plant floor, an old number</text>
<text x="106" y="175" font-size="15">that looks live is worse than no</text>
<text x="106" y="196" font-size="15">number at all.</text>
<line x1="398" y1="104" x2="656" y2="104" stroke="#8250df" stroke-opacity=".55" stroke-width="2"/>
<text x="398" y="128" font-size="11.5" letter-spacing="1.8" class="mono" fill="#8250df" font-weight="700">DECISION</text>
<text x="398" y="154" font-size="15">Stream live values, and say</text>
<text x="398" y="175" font-size="15">plainly when a connection drops</text>
<text x="398" y="196" font-size="15">and the data goes stale.</text>
<line x1="690" y1="104" x2="948" y2="104" stroke="#1a7f37" stroke-opacity=".55" stroke-width="2"/>
<text x="690" y="128" font-size="11.5" letter-spacing="1.8" class="mono" fill="#1a7f37" font-weight="700">OUTCOME</text>
<text x="690" y="154" font-size="15">Operators can trust what the</text>
<text x="690" y="175" font-size="15">screen tells them. On a dashboard,</text>
<text x="690" y="196" font-size="15">trust is the product.</text>
</svg>