<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="03 opc-ua-monitor: Live plant data, and honest when it goes stale.">
<style>
text{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#e6edf3}
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.seg{fill:#f0b72f;font-weight:700} .el{fill:#58a6ff} .term{fill:#ff7b72} .comp{fill:#d2a8ff}
.muted{fill:#7d8590} .ok{fill:#3fb950}
.key{font-weight:700;animation:glow 2.4s ease-in-out infinite}
.dot{animation:glow 2.4s ease-in-out infinite}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes glow{50%{opacity:.3}}
@keyframes blink{50%{opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e6edf3" fill-opacity=".07"/></pattern><radialGradient id="glow" cx="18%" cy="0%" r="70%"><stop offset="0" stop-color="#58a6ff" stop-opacity=".16"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient></defs>
<rect width="1000" height="150" rx="14" fill="#0d1117"/>
<rect width="1000" height="150" rx="14" fill="url(#dots)"/>
<rect width="1000" height="150" rx="14" fill="url(#glow)"/>
<rect x=".5" y=".5" width="999" height="149" rx="14" fill="none" stroke="#30363d"/>
<rect x="16" y="28" width="3" height="94" rx="1.5" fill="#f0b72f"/>
<text x="34" y="74" font-size="40" font-weight="800" fill="none" stroke="#f0b72f" stroke-width="1.2">03</text>
<text x="104" y="50" font-size="12.5" class="muted">github.com/yurii1exe/<tspan class="el">opc-ua-monitor</tspan></text>
<text x="104" y="82" font-size="27" font-weight="700">opc-ua-monitor</text>
<text x="105" y="108" class="sans muted" font-size="16">Live plant data, and honest when it goes stale.</text>
<rect x="104" y="120" width="57.6" height="20" rx="10" fill="#161b22" stroke="#30363d"/><text x="132.8" y="134" text-anchor="middle" font-size="11" class="muted" textLength="39.6" lengthAdjust="spacingAndGlyphs">.NET 8</text>
<rect x="169.6" y="120" width="57.6" height="20" rx="10" fill="#161b22" stroke="#30363d"/><text x="198.4" y="134" text-anchor="middle" font-size="11" class="muted" textLength="39.6" lengthAdjust="spacingAndGlyphs">OPC UA</text>
<rect x="235.2" y="120" width="64.2" height="20" rx="10" fill="#161b22" stroke="#30363d"/><text x="267.3" y="134" text-anchor="middle" font-size="11" class="muted" textLength="46.2" lengthAdjust="spacingAndGlyphs">SignalR</text>
<rect x="307.4" y="120" width="64.2" height="20" rx="10" fill="#161b22" stroke="#30363d"/><text x="339.5" y="134" text-anchor="middle" font-size="11" class="muted" textLength="46.2" lengthAdjust="spacingAndGlyphs">Angular</text>
<text x="960" y="50" text-anchor="end" font-size="12.5" class="comp" font-weight="600">stale ≠ current</text>
<text x="960" y="84" text-anchor="end" font-size="14"><tspan class="seg">node</tspan><tspan class="term"> → </tspan><tspan class="el">subscription</tspan><tspan class="term"> → </tspan><tspan class="el">SignalR</tspan><tspan class="term"> → </tspan><tspan class="seg">chart</tspan></text>
</svg>