<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" fill="#e6edf3" role="img" aria-label="03 opc-ua-monitor: Live plant data, and honest when it goes stale.">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.muted{fill:#7d8590}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e6edf3" fill-opacity=".07"/></pattern><radialGradient id="glow" cx="15%" cy="0%" r="75%"><stop offset="0" stop-color="#58a6ff" stop-opacity=".16"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient><radialGradient id="glow2" cx="95%" cy="100%" r="60%"><stop offset="0" stop-color="#bc8cff" stop-opacity=".12"/><stop offset="1" stop-color="#bc8cff" stop-opacity="0"/></radialGradient><linearGradient id="flow" x1="0" x2="1000" y1="0" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#58a6ff"/><stop offset=".5" stop-color="#bc8cff"/><stop offset="1" stop-color="#3fb950"/></linearGradient></defs>
<rect width="1000" height="150" rx="16" fill="#0d1117"/>
<rect width="1000" height="150" rx="16" fill="url(#dots)"/>
<rect width="1000" height="150" rx="16" fill="url(#glow)"/>
<rect width="1000" height="150" rx="16" fill="url(#glow2)"/>
<rect x=".5" y=".5" width="999" height="149" rx="16" fill="none" stroke="#30363d"/>
<rect x="16" y="28" width="3" height="94" rx="1.5" fill="url(#flow)"/>
<text x="36" y="76" font-size="42" font-weight="800" fill="none" stroke="url(#flow)" stroke-width="1.3">03</text>
<text x="106" y="50" font-size="12.5" class="mono muted">github.com/yurii1exe/<tspan fill="#58a6ff">opc-ua-monitor</tspan></text>
<text x="105" y="83" font-size="27" font-weight="750" class="mono">opc-ua-monitor</text>
<text x="106" y="108" font-size="16" class="muted">Live plant data, and honest when it goes stale.</text>
<rect x="106" y="120" width="57.6" height="20" rx="10" fill="#161b22" stroke="#30363d"/><text x="134.8" y="134" text-anchor="middle" font-size="11" class="mono muted" textLength="39.6" lengthAdjust="spacingAndGlyphs">.NET 8</text>
<rect x="171.6" y="120" width="57.6" height="20" rx="10" fill="#161b22" stroke="#30363d"/><text x="200.4" y="134" text-anchor="middle" font-size="11" class="mono muted" textLength="39.6" lengthAdjust="spacingAndGlyphs">OPC UA</text>
<rect x="237.2" y="120" width="64.2" height="20" rx="10" fill="#161b22" stroke="#30363d"/><text x="269.3" y="134" text-anchor="middle" font-size="11" class="mono muted" textLength="46.2" lengthAdjust="spacingAndGlyphs">SignalR</text>
<rect x="309.4" y="120" width="64.2" height="20" rx="10" fill="#161b22" stroke="#30363d"/><text x="341.5" y="134" text-anchor="middle" font-size="11" class="mono muted" textLength="46.2" lengthAdjust="spacingAndGlyphs">Angular</text>
<text x="960" y="50" text-anchor="end" font-size="13" font-weight="600" fill="#bc8cff">real-time</text>
<text x="960" y="84" text-anchor="end" font-size="14" class="mono"><tspan fill="#58a6ff">machine</tspan><tspan class="muted"> → </tspan><tspan fill="#bc8cff">subscription</tspan><tspan class="muted"> → </tspan><tspan fill="#bc8cff">SignalR</tspan><tspan class="muted"> → </tspan><tspan fill="#3fb950">chart</tspan></text>
</svg>